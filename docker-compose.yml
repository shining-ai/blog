services:
  programming_navi:
    build: .
    tty: true
    stdin_open: true
    ports:
      - "3003:3003"
    volumes:
      - ./programming_navi:/app
      - programming_navi_node_modules:/app/node_modules
      - programming_navi_docusaurus:/app/.docusaurus
    working_dir: /app
    command: sh -c "yarn install && yarn start --host 0.0.0.0 --port 3003"

  computer_navi:
    build: .
    tty: true
    stdin_open: true
    ports:
      - "3004:3004"
    volumes:
      - ./computer_navi:/app
      - computer_navi_node_modules:/app/node_modules
      - computer_navi_docusaurus:/app/.docusaurus
    working_dir: /app
    command: sh -c "yarn install && yarn start --host 0.0.0.0 --port 3004"

  software_navi:
    build: .
    tty: true
    stdin_open: true
    ports:
      - "3010:3010"
    volumes:
      - ./software_navi:/app
      - software_navi_node_modules:/app/node_modules
      - software_navi_docusaurus:/app/.docusaurus
    working_dir: /app
    command: sh -c "yarn install && yarn start --host 0.0.0.0 --port 3010"

volumes:
  programming_navi_node_modules:
  programming_navi_docusaurus:
  computer_navi_node_modules:
  computer_navi_docusaurus:
  software_navi_node_modules:
  software_navi_docusaurus:
