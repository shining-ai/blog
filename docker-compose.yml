services:
  programming_navi:
    build: .
    tty: true
    stdin_open: true
    ports:
      - "3003:3003"
    volumes:
      - ./programming_navi:/app
    working_dir: /app
    command: sh -c "yarn install && yarn start --host 0.0.0.0 --port 3003"

  computer_navi:
    build: .
    tty: true
    stdin_open: true
    ports:
      - "3004:3004"
    volumes:
      - ./computer_navi:/app
    working_dir: /app
    command: sh -c "yarn install && yarn start --host 0.0.0.0 --port 3004"

  graphics_navi:
    build: .
    tty: true
    stdin_open: true
    ports:
      - "3013:3013"
    volumes:
      - ./graphics_navi:/app
      - graphics_navi_node_modules:/app/node_modules
      - graphics_navi_docusaurus:/app/.docusaurus
    working_dir: /app
    command: sh -c "yarn install && yarn start --host 0.0.0.0 --port 3013"

volumes:
  graphics_navi_node_modules:
  graphics_navi_docusaurus:
