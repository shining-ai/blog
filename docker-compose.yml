services:
  algorithm_navi:
    build: .
    tty: true
    stdin_open: true
    ports:
      - "3003:3003"
    volumes:
      - ./algorithm_navi:/app
      - algorithm_navi_node_modules:/app/node_modules
      - algorithm_navi_docusaurus:/app/.docusaurus
    working_dir: /app
    command: sh -c "yarn install && yarn start --host 0.0.0.0 --port 3003"

  system_navi:
    build: .
    tty: true
    stdin_open: true
    ports:
      - "3004:3004"
    volumes:
      - ./system_navi:/app
      - system_navi_node_modules:/app/node_modules
      - system_navi_docusaurus:/app/.docusaurus
    working_dir: /app
    command: sh -c "yarn install && yarn start --host 0.0.0.0 --port 3004"

volumes:
  algorithm_navi_node_modules:
  algorithm_navi_docusaurus:
  system_navi_node_modules:
  system_navi_docusaurus:
